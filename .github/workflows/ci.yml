name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the comment names the release.
# Dependabot (.github/dependabot.yml) keeps both up to date.

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Install Chromium for the browser tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          bun x --no-install playwright-core install --with-deps --no-shell chromium
          browser=$(node -p 'require("playwright-core").chromium.executablePath()')
          test -x "$browser"
          echo "SAP_TEST_CHROME=$browser" >> "$GITHUB_ENV"
      # Linux/Node 24 exercises Web GUI, Fiori and the extension against synthetic pages.
      - run: bun run test
      - run: bun run build
      - name: The built command runs on plain Node
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
      - name: The package holds only what should ship
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          # The single quotes hold JavaScript, not shell.
          # shellcheck disable=SC2016
          node -e '
            const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const allowed = /^(dist\/|skills\/|extension\/|native-host\/|docs\/.+\.md$|README\.md$|CHANGELOG\.md$|LICENSE$|package\.json$)/;
            // Never shipped, wherever they sit: VitePress config and
            // cache, source maps, env files, recorded tests and screen captures (they hold business data).
            const forbidden = [
              /^docs\/node_modules\//,
              /(^|\/)\.vitepress\//,
              /\.map$/,
              /(^|\/)\.env(\.|$)/,
              /\.saptest\.json$/,
              /(^|\/)captures\//,
              /^(?!extension\/icons\/).*\.png$/i, // PNGs, except the extension icons
            ];
            const bad = files.filter((p) => !allowed.test(p) || forbidden.some((re) => re.test(p)));
            for (const need of [
              "dist/cli.js",
              "dist/index.js",
              "dist/runner/index.js",
              "dist/sapgui/ps/host.ps1",
              "docs/getting-started/installation.md",
              "LICENSE",
              "README.md",
              "CHANGELOG.md",
            ])
              if (!files.includes(need)) bad.push(`missing: ${need}`);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log(`${files.length} files, all expected`);
          ' "$RUNNER_TEMP/pack.json"
      # The packed tarball, installed the way a user gets it, in a directory that knows nothing of
      # this checkout. The tarball is referenced by a relative ./ path: npx reads an absolute path
      # (and a Windows drive path) as a command, not a package.
      - name: The packed tarball installs and runs
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/pack-smoke"
          mkdir -p "$smoke"
          npm pack --pack-destination "$smoke"
          cd "$smoke"
          tarballs=(./sap-ui-automation-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "expected exactly one tarball, got: ${tarballs[*]}"; exit 1
          fi
          tgz="${tarballs[0]}"
          echo "::group::npx --package $tgz"
          npx --yes --package="$tgz" sap-ui-automation --version
          npx --yes --package="$tgz" sap-ui-automation --help
          echo "::endgroup::"
          echo "::group::npm install $tgz in a fresh project"
          mkdir project && cd project
          npm init -y > /dev/null
          npm install --no-audit --no-fund "../$tgz"
          npx --no-install sap-ui-automation --version
          # Existing scripts can still invoke the compatibility alias.
          npx --no-install sap-gui --version
          node --input-type=module -e 'await import("sap-ui-automation"); console.log("library entry imports")'
          node --input-type=module -e 'await import("sap-ui-automation/test"); console.log("test entry imports")'
          echo "::endgroup::"
          # npm init writes "type": "commonjs": the TypeScript config and tests must still load.
          echo "::group::init --yes, then the runner lists the example test"
          npx --no-install sap-ui-automation init --yes
          npx --no-install sap-ui-automation test --list | tee "$RUNNER_TEMP/list.txt"
          grep -q "SU3 shows my user" "$RUNNER_TEMP/list.txt"
          echo "::endgroup::"
      # The built server against the fake SAP GUI (COM, through Windows PowerShell).
      # Not yet run on a CI runner: kept non-blocking until it has passed once.
      - name: SAP GUI surface end to end, against the fake SAP GUI
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: node test/sapgui/e2e.mjs

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # VitePress fails the build on dead internal links.
      - run: bun run build

  mcpb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking for now: scripts/build-mcpb.mjs (the Claude Desktop bundle) is new.
    # Drop continue-on-error once it has passed on main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:mcpb

