name: Bug report
description: Something the server did wrong, or a screen it read wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Setup does not work? Use "Setup problem" instead. **Leave real SAP data out**: replace customer names, numbers, texts, host names and user names in views and logs with made-up ones. Security issues go through [SECURITY.md](https://github.com/DidroAI/sap-ui-mcp/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked the agent, what the server did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The transaction or app, and the tool calls (`sap_act` actions) if you have them.
      placeholder: |
        1. Open VA03 in Web GUI
        2. sap_act {"do":"set","id":"ctxtVBAK-VBELN","value":"4711"}
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - SAP GUI for Windows (scripting)
        - SAP GUI for Windows, network reader (SAP_GUI_METHOD=diag)
        - Web GUI (SAP GUI for HTML)
        - Fiori launchpad
        - Web GUI app inside the Fiori launchpad
        - The Chrome extension (SAP_BROWSER=extension)
        - Record and replay, or export
        - SDK or test runner
        - sap-ui-automation CLI (setup, doctor, sessions)
        - Not specific to a surface
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sap-ui-automation version
      description: "`npx -y sap-ui-automation --version`"
    validations:
      required: true
  - type: input
    id: sap-release
    attributes:
      label: SAP product and SAP_BASIS release
      description: For example "SAP ERP 6.0 EHP8, SAP_BASIS 750" or "S/4HANA 2023, SAP_BASIS 758" (System > Status > Component information). Logon language too, if not English.
  - type: input
    id: gui-version
    attributes:
      label: SAP GUI version
      description: For SAP GUI surfaces. For example "SAP GUI for Windows 8.00 PL 12" (Help > About SAP Logon).
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: For Web GUI and Fiori. For example "Chrome 146" or "Edge 145", and the browser mode (SAP_BROWSER launch, attach or extension).
  - type: input
    id: client
    attributes:
      label: MCP client and version
      description: For example "Claude Code 2.1", "Codex 0.9", "Cursor 1.8", "VS Code 1.106".
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example "Windows 11 24H2", "macOS 15.5".
  - type: textarea
    id: view
    attributes:
      label: The view or the answer (made-up data)
      description: The output of `sap_look` or `sap_act`, with real data replaced.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of doctor
      description: "`npx -y sap-ui-automation doctor`. Replace host names and user names."
      render: text
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: The SAP_* environment variables you set (never a password).
      render: text
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Data
      options:
        - label: I removed business data, host names and personal data from what I pasted.
          required: true
